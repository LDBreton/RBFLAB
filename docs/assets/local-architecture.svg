<title id="title">From mathematical functionals to matrix algorithms</title><desc id="desc">Geometry, spaces, and sampled functionals feed a shared approximation engine. Python, C++, and PyTorch execute local algebra. Named matrix blocks are used in user-written stationary solves, time stepping, and reconstruction.</desc>
