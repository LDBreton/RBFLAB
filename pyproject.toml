[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rbflab"
version = "0.2.0"
description = "RBFLAB: radial basis functions for interpolation and PDEs"
readme = {file = "README_PYPI.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE", "docs/provenance/RBFMeshGen-LICENSE.txt"]
requires-python = ">=3.11"
keywords = ["radial basis functions", "meshless", "PDE", "RBF-FD", "collocation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.26", "scipy>=1.11", "sympy>=1.12", "mpmath>=1.3", "threadpoolctl>=3.5", "shapely>=2.0"]

[project.urls]
Homepage = "https://github.com/LDBreton/RBFLAB"
Repository = "https://github.com/LDBreton/RBFLAB"
Issues = "https://github.com/LDBreton/RBFLAB/issues"

[project.optional-dependencies]
torch = ["torch>=2.2"]
fast = ["gmpy2>=2.2"]
mesh = ["gmsh>=4.12"]
test = ["pytest>=8"]
examples = ["matplotlib>=3.8", "pillow>=10"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9", "mkdocstrings[python]>=0.30"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
