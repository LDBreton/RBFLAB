name: release smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installed-wheel:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Install wheel
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Run tutorials outside checkout
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rbflab-smoke"
          cp examples/symbolic_poisson.py examples/symbolic_boundary.py examples/symbolic_heat.py examples/stokes_spaces.py examples/operators_3d.py examples/custom_kernel.py "$RUNNER_TEMP/rbflab-smoke/"
          cp -r examples "$RUNNER_TEMP/rbflab-smoke/examples"
          cd "$RUNNER_TEMP/rbflab-smoke"
          python symbolic_poisson.py
          python symbolic_poisson.py --method lhi
          python symbolic_poisson.py --method rbffd
          python symbolic_boundary.py
          python symbolic_heat.py
          python stokes_spaces.py
          python operators_3d.py
          python custom_kernel.py
          python -c 'import sys; from rbflab import geometry, meshgen; assert len(meshgen.generate(geometry.Sphere(), interior=10, boundary=12).points) == 22; assert not any(m in sys.modules for m in ("torch", "gmsh", "matplotlib"))'
          python -c 'import sympy as s; from rbflab import geometry as g, meshgen as m; t=s.Symbol("t"); b=g.Border((s.cos(t),s.sin(t)),"wall",0,2*s.pi); assert len(m.generate([b(32)],interior=10).points)==42; c=g.ParametricBoundary((s.cos(t),s.sin(t)),interval=(0,2*s.pi)); assert len(m.generate(g.ParametricDomain(c),interior=10,boundary=32).points)==42'
          python -c 'from examples.annulus import run; assert run()[3]["off_node_max"] < .015'
          python -c 'from examples.poisson_perforated import run; assert run()[3]["off_node_max"] < .0002'
          python -c 'from examples.ball_poisson import run; assert run()[3]["off_node_max"] < .002'
          python -c 'from symbolic_poisson import run; assert run("global") < 0.05; assert run("lhi") < 0.05; assert run("rbffd") < 0.05'
          python -c 'from symbolic_boundary import run; assert run() < 0.1'
          python -c 'from symbolic_heat import run; assert run() < 0.02'
          python -c 'from stokes_spaces import run; assert max(run()) < 1e-6; assert max(run("lhi")) < 1e-6'
          python -c 'from operators_3d import run; assert max(run()) < 1e-8'
          python -c 'from custom_kernel import run; assert run() < 0.05'

  native-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: bash cpp/prepare_dependencies.sh
      - run: python -m examples.build_cpp_backend
      - name: Verify native local operators
        run: RBFLAB_CPP_TESTS=1 python -m pytest tests/test_discrete_operators.py tests/test_symbolic_kernel.py tests/test_curved_examples.py::test_optional_curved_backend_parity -q

  gallery-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[examples,test]'
      - run: python -m examples.make_teaching_figures
      - run: python -m examples.make_gallery
      - run: python -m examples.make_geometry_gallery
      - run: python -m examples.geometry_gallery
      - run: python -m examples.mesh_construction
      - run: python -m pytest tests/test_mesh_generation_docs.py -q
      - run: python -m pytest tests/test_domain_viz.py tests/test_curved_geometry.py -q
      - run: python -m pytest tests/test_cavity_example.py -q
      - run: python -m examples.navier_stokes_cavity --cells 6 --end .005 --output docs/assets/cavity_smoke.gif
      - name: Verify generated images
        run: |
          python -c 'from pathlib import Path; from PIL import Image; p=Path("docs/assets"); assert Image.open(p/"heat_diffusion.gif").n_frames >= 10; assert Image.open(p/"cavity_smoke.gif").n_frames >= 2; assert all((p/name).stat().st_size > 10000 for name in ("heat_diffusion.png", "stokes_velocity.png", "navier_stokes_cavity.png"))'


  geometry-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - run: python -m pip install -e '.[test,mesh]'
      - run: python -m pytest tests/meshgen tests/test_curved_geometry.py tests/test_composed_geometry.py tests/test_curve_generation.py -q

  torch-ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests/test_curved_examples.py::test_optional_curved_backend_parity -q
      - run: python -m examples.ball_poisson --backend torch
