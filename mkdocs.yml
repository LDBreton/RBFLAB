site_name: RBFLAB Documentation
site_description: Radial basis functions for interpolation and PDEs
site_url: https://ldbreton.github.io/RBFLAB/
repo_url: https://github.com/LDBreton/RBFLAB
repo_name: LDBreton/RBFLAB
theme:
  name: material
  font: false
  logo: assets/rbflab-mark.svg
  favicon: assets/rbflab-mark.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - stylesheets/manual.css
copyright: Copyright &copy; 2026 Louis Breton · MIT License
hooks:
  - scripts/docs_hooks.py
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_if_no_docstring: false
            members_order: source
            filters: ["!^_"]
markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: .
      check_paths: true
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Manual overview: index.md
  - Introduction:
      - First problem: getting-started.md
      - Installation: INSTALL.md
  - Geometry and nodes:
      - Geometry to PDE: geometry/index.md
      - Geometry cookbook: geometry/cookbook.md
      - Custom domains and 3D: geometry/custom-domains.md
      - Gmsh and staggered clouds: geometry/staggered.md
  - Curved-domain examples:
      - Poisson with holes: tutorials/perforated-poisson.md
      - Laplace on an annulus: tutorials/annulus.md
      - Heat on a flower: tutorials/flower-heat.md
      - Mixed conditions on an ellipse: tutorials/ellipse.md
      - Annular Stokes flow: tutorials/annular-stokes.md
      - Poisson inside a ball: tutorials/ball.md
  - Learning by examples:
      - Interpolation and derivatives: tutorials/interpolation.md
      - One RBF-FD stencil: tutorials/one-stencil.md
      - Heat equation from matrices: tutorials/heat-equation.md
      - Mixed-boundary Poisson: tutorials/mixed-boundary.md
      - Global collocation and LHI: tutorials/global-lhi.md
      - Symbolic custom kernels: tutorials/custom-kernel.md
      - Steady and unsteady Stokes: tutorials/stokes.md
      - A 3D scalar problem: tutorials/scalar-3d.md
      - Navier-Stokes cavity: tutorials/cavity.md
  - Mathematical foundations:
      - Reading route: theory/index.md
      - Notation and model problem: theory/notation.md
      - Kernel interpolation: theory/interpolation.md
      - Global collocation: theory/global.md
      - From approximation to weights: theory/local-weights.md
      - RBF finite differences: theory/rbf-fd.md
      - Local Hermite interpolation: theory/lhi.md
      - Divergence-free spaces and Stokes: theory/divergence-free.md
      - Time discretization: theory/time-discretization.md
      - Conditioning and precision: theory/conditioning.md
      - Errors and residuals: theory/errors.md
      - Papers and further reading: theory/references.md
  - Practical guides:
      - Visualization: VISUALIZATION.md
      - Curved-domain backends: guides/curved-backends.md
      - Curved-domain validation: guides/curved-validation.md
      - Lid-driven cavity: guides/LID_DRIVEN_CAVITY.md
  - API reference:
      - Kernels and geometry: api/kernels-geometry.md
      - Geometry and generation: api/mesh-generation.md
      - Equations and spaces: api/equations-spaces.md
      - Discretizations: api/discretizations.md
      - Precision and backends: api/precision-backends.md
      - Diagnostics and visualization: api/diagnostics-viz.md
  - Capabilities: CAPABILITIES.md
  - Contributing:
      - Maintaining docs: MAINTAINING_DOCS.md
