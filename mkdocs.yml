site_name: RBFLAB Documentation
site_description: Radial basis functions for interpolation and PDEs
site_url: https://ldbreton.github.io/RBFLAB/
repo_url: https://github.com/LDBreton/RBFLAB
repo_name: LDBreton/RBFLAB
theme:
  name: material
  font: false
  logo: assets/rbflab-mark.svg
  favicon: assets/rbflab-mark.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - stylesheets/manual.css
copyright: Copyright &copy; 2026 Louis Breton · MIT License
hooks:
  - scripts/docs_hooks.py
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_if_no_docstring: false
            members_order: source
            filters: ["!^_"]
markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: .
      check_paths: true
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Manual overview: index.md
  - Introduction:
      - Installation: INSTALL.md
      - Your first RBF problem: getting-started.md
  - Mesh generation:
      - Construction overview: geometry/index.md
      - 2D domains:
          - Built-in shapes and holes: geometry/planar-domains.md
          - Oriented borders: geometry/parametric-borders.md
          - Parametric contours: geometry/custom-domains.md
          - Labels and normals: geometry/labels-normals.md
      - Sampling and quality: geometry/sampling.md
      - 3D geometry:
          - Volume clouds: geometry/volumes-3d.md
          - Surface clouds: geometry/surfaces-3d.md
      - Connected meshes:
          - Gmsh triangles: geometry/gmsh.md
          - Staggered clouds explained: geometry/staggered.md
  - Tutorials:
      - Learning route: tutorials/index.md
      - 1. Interpolate scattered data: tutorials/interpolation.md
      - 2. From samples to operators: tutorials/local-approximation.md
      - 3. Assemble a stationary PDE: tutorials/custom-assembly.md
      - 4. Global collocation: tutorials/global-collocation.md
      - 5. Local Hermite interpolation: tutorials/lhi.md
      - 6. Time-step the heat equation: tutorials/heat-equation.md
      - Extensions:
          - Differentiate a field: tutorials/differentiation.md
          - One RBF-FD stencil: tutorials/one-stencil.md
          - Define a custom kernel: tutorials/custom-kernel.md
          - Independent LHI centers: tutorials/lhi-centers.md
          - LHI and heat from matrices: tutorials/lhi-matrices.md
          - Symbolic PDE convenience: tutorials/symbolic-pde.md
          - Teach and adapt: tutorials/teaching.md
  - Gallery and advanced:
      - Choose an application: gallery/index.md
      - Poisson with holes: tutorials/perforated-poisson.md
      - Mixed boundaries on an ellipse: tutorials/ellipse.md
      - Heat on a flower: tutorials/flower-heat.md
      - Poisson inside a 3D ball: tutorials/ball.md
      - Coupled Stokes fields: tutorials/annular-stokes.md
      - Cavity flow algorithm: tutorials/cavity.md
      - Compare global and local methods: tutorials/global-lhi.md
      - Stokes velocity: tutorials/stokes.md
      - Mixed-boundary application: tutorials/mixed-boundary.md
      - Scalar 3D application: tutorials/scalar-3d.md
  - Mathematical foundations:
      - Reading route: theory/index.md
      - Notation and model problem: theory/notation.md
      - Kernel interpolation: theory/interpolation.md
      - Global collocation: theory/global.md
      - From approximation to weights: theory/local-weights.md
      - RBF finite differences: theory/rbf-fd.md
      - Local Hermite interpolation: theory/lhi.md
      - Divergence-free spaces and Stokes: theory/divergence-free.md
      - Time discretization: theory/time-discretization.md
      - Conditioning and precision: theory/conditioning.md
      - Errors and residuals: theory/errors.md
      - Papers and further reading: theory/references.md
  - Practical guides:
      - Construct your own method: guides/research-api.md
      - Visualization: VISUALIZATION.md
      - Curved-domain backends: guides/curved-backends.md
      - Curved-domain validation: guides/curved-validation.md
  - API reference:
      - Kernels and geometry: api/kernels-geometry.md
      - Geometry and generation: api/mesh-generation.md
      - Equations and spaces: api/equations-spaces.md
      - Discretizations: api/discretizations.md
